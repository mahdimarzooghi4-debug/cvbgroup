services:
  - type: web
    name: cvbgroup-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: feat/site-mvp
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cvbgroup-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cvbgroup-staging.onrender.com
      - key: APP_ENV
        value: staging

databases:
  - name: cvbgroup-staging-db
    databaseName: cvbgroup_staging
    user: cvbgroup_staging
    plan: free
    region: frankfurt
